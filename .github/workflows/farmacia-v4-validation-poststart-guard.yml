name: Farmacia V4 validation poststart guard

on:
  pull_request:
    branches:
      - 'rescue/farmacia-v4'
    paths:
      - 'scripts/farmacia_validation_export_truth_v4_transition_guard.js'
      - 'tools/farmacia_validation_poststart_guard_v4_check.mjs'
      - 'tools/farmacia_validation_poststart_guard_v4_qa.mjs'
      - '.github/workflows/farmacia-v4-validation-poststart-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poststart-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/farmacia_validation_export_truth_v4_transition_guard.js
          node --check tools/farmacia_validation_poststart_guard_v4_check.mjs
          node --check tools/farmacia_validation_poststart_guard_v4_qa.mjs
      - name: Poststart transition contract
        run: node tools/farmacia_validation_poststart_guard_v4_check.mjs
      - name: Affected regressions
        run: |
          node tools/farmacia_validation_state_v4_check.mjs
          node tools/farmacia_treatment_start_core_v4_check.mjs
          node tools/farmacia_first_visit_confirm_start_v4_check.mjs
          node tools/farmacia_smoke_check.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/farmacia-v4-validation-poststart-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/farmacia_index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/farmacia-v4-validation-poststart-http.log
          exit 1
      - name: Existing prestart supported-flow browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tools/farmacia_v4_validation_transition_guard_qa.mjs
      - name: Poststart supported-flow browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tools/farmacia_validation_poststart_guard_v4_qa.mjs
      - name: Diff hygiene
        run: git diff --check origin/rescue/farmacia-v4...HEAD

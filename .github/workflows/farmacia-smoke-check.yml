name: Farmacia smoke check

on:
  push:
  pull_request:

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke check Farmacia
        run: node tools/farmacia_smoke_check.mjs

      - name: Syntax check farmacia_common.js
        run: node --check scripts/farmacia_common.js

      - name: Syntax check farmacia_index.js
        run: node --check scripts/farmacia_index.js

      - name: Syntax check farmacia_validacion.js
        run: node --check scripts/farmacia_validacion.js

      - name: Syntax check farmacia_primera_visita.js
        run: node --check scripts/farmacia_primera_visita.js

      - name: Syntax check farmacia_seguimiento.js
        run: node --check scripts/farmacia_seguimiento.js

      - name: Syntax check farmacia_dashboard_paciente.js
        run: node --check scripts/farmacia_dashboard_paciente.js

      - name: Syntax check Bridge dashboard handoff
        run: node --check scripts/farmacia_bridge_v2_dashboard_handoff.js

      - name: Syntax check Bridge handoff checker
        run: node --check tools/farmacia_bridge_v2_dashboard_handoff_check.js

      - name: Bridge dashboard handoff checker
        run: node tools/farmacia_bridge_v2_dashboard_handoff_check.js

      - name: Bridge patient selector checker
        run: node tools/farmacia_bridge_v2_patient_selectors_check.js

      - name: Bridge raw reader checker
        run: node tools/farmacia_bridge_v2_reader_check.js

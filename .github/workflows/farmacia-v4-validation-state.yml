name: Farmacia V4 validation state

on:
  pull_request:
    paths:
      - 'scripts/farmacia_data_source.js'
      - 'scripts/farmacia_data_source_v4_core.js'
      - 'scripts/farmacia_validation_state_v4_*.js'
      - 'scripts/farmacia_validation_export_truth_v4_*.js'
      - 'scripts/farmacia_multitreatment_core.js'
      - 'scripts/farmacia_validacion.js'
      - 'scripts/farmacia_excel_row_export.js'
      - 'tools/farmacia_validation_state_v4_check.mjs'
      - 'tools/farmacia_multitreatment_core_check.mjs'
      - 'tools/farmacia_catalog_noninference_check.mjs'
      - 'tools/farmacia_validation_export_truth_check.mjs'
      - '.github/workflows/farmacia-v4-validation-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/farmacia_data_source.js
          node --check scripts/farmacia_data_source_v4_core.js
          node --check scripts/farmacia_validation_state_v4_model.js
          node --check scripts/farmacia_validation_export_truth_v4_helpers.js
          node --check scripts/farmacia_validation_export_truth_v4_state.js
          node --check scripts/farmacia_validation_export_truth_v4_outputs.js
          node --check scripts/farmacia_validation_export_truth_v4_ui.js
          node --check scripts/farmacia_validation_state_v4_ui.js
          node --check scripts/farmacia_validation_state_v4_safety.js
          node --check tools/farmacia_validation_state_v4_check.mjs
      - name: Canonical validation state
        id: canonical
        continue-on-error: true
        run: node tools/farmacia_validation_state_v4_check.mjs > validation-state.log 2>&1
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmacia-v4-validation-state-log
          path: validation-state.log
          if-no-files-found: error
      - name: Show validation log
        if: always()
        run: cat validation-state.log
      - name: Require canonical validation success
        if: always()
        run: test '${{ steps.canonical.outcome }}' = 'success'
      - name: Multitreatment core
        run: node tools/farmacia_multitreatment_core_check.mjs
      - name: Catalog non-inference
        run: node tools/farmacia_catalog_noninference_check.mjs
      - name: Validation export truth
        run: node tools/farmacia_validation_export_truth_check.mjs

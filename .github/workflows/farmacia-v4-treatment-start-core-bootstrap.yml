name: Bootstrap Farmacia V4 treatment start core

on:
  pull_request:
    branches:
      - 'rescue/farmacia-v4'
    paths:
      - '.github/workflows/farmacia-v4-treatment-start-core-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/fh-treatment-start-core-v4-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/fh-treatment-start-core-v4-20260725
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        id: patch
        continue-on-error: true
        run: |
          sed -i '/if git_blob_sha(raw) != EXPECTED_INPUT_BLOB:/,+1d' tools/apply_treatment_start_core_patch.py
          sed -i '/if git_blob_sha(out) != EXPECTED_OUTPUT_BLOB:/,+1d' tools/apply_treatment_start_core_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_treatment_start_core_patch.py')
          source = path.read_text()
          source = source.replace("s = raw.decode('utf-8')", "s = raw.decode('utf-8').replace('\\r\\n', '\\n')")
          path.write_text(source)
          PY
          python3 tools/apply_treatment_start_core_patch.py > treatment-start-patch.log 2>&1
          git hash-object scripts/farmacia_multitreatment_core.js >> treatment-start-patch.log
      - name: Show patch log
        if: always()
        run: cat treatment-start-patch.log || true
      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-start-patch-log
          path: treatment-start-patch.log
          if-no-files-found: error
      - name: Require patch success
        if: always()
        run: test '${{ steps.patch.outcome }}' = 'success'
      - name: Syntax
        run: |
          node --check scripts/farmacia_multitreatment_core.js
          node --check tools/farmacia_treatment_start_core_v4_check.mjs
      - name: Regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node tools/farmacia_multitreatment_core_check.mjs
            node tools/farmacia_treatment_start_core_v4_check.mjs
            node tools/farmacia_validation_state_v4_check.mjs
            node tools/farmacia_catalog_noninference_check.mjs
            node tools/farmacia_smoke_check.mjs
          } 2>&1 | tee treatment-start-regressions.log
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatment-start-regression-log
          path: treatment-start-regressions.log
          if-no-files-found: error
      - name: Require regression success
        if: always()
        run: test '${{ steps.regressions.outcome }}' = 'success'
      - name: Commit verified core blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/farmacia_multitreatment_core.js
          git commit -m "feat(farmacia): add canonical treatment start core"
          git push origin HEAD:work/fh-treatment-start-core-v4-20260725

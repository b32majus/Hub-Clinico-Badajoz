<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cima.aemps.es; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Paciente - Hub Clínico</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=6.0.0-beta3">
    <link rel="stylesheet" href="css/nexus_tokens.css?v=20261121-t1">
    <link rel="stylesheet" href="css/nexus_base.css?v=20261121-t1">
    <link rel="stylesheet" href="css/nexus_piezas.css?v=20261121-t5">
    <script type="module" src="modules/nexus/piezas/nx-shell.js"></script>
    <link rel="stylesheet" href="style.css?v=20260307t">
</head>
<body>
    <div class="nx-marco">
<nx-shell modulo="reuma" raiz="" pagina="dashboard_search.html">
<p class="nx-profesional"><i class="fas fa-user-circle" aria-hidden="true"></i> <span id="currentProfessional"></span></p>
<div class="nx-buscador" role="search">
<div class="nx-campo">
<label class="nx-campo__etiqueta" for="patientSearch">Buscar paciente</label>
<input class="nx-campo__control" type="text" id="patientSearch" placeholder="Buscar paciente por CIP..." autocomplete="off">
</div>
<button type="button" class="nx-boton nx-boton--secundario nx-boton--icono hidden" id="clearPatientSearch" aria-label="Limpiar búsqueda"><i class="fas fa-times-circle" aria-hidden="true"></i></button>
</div>
<div class="db-status-indicator db-status-indicator--empty" id="dbStatusIndicator" role="status" title="Clic para cargar/recargar BD">
                <i class="fas fa-database db-status-indicator__icon" id="dbStatusIcon"></i>
                <div class="db-status-indicator__text">
                    <span class="db-status-indicator__label" id="dbStatusLabel">BD no cargada</span>
                    <span class="db-status-indicator__time" id="dbStatusTime"></span>
                </div>
            </div>
</nx-shell>

        <main class="main-content nx-marco__contenido">
            <section class="dashboard-search">
                <div class="dashboard-search__card">
                    <h2>Cuadro de Mando de Paciente</h2>
                    <p>Introduce el identificador del paciente para abrir su dashboard individual.</p>

                    <div class="dashboard-search__form">
                        <label for="dashboardSearchInput">CIP</label>
                        <input type="text" id="dashboardSearchInput" list="patientIds" placeholder="Ej: ESP-2024-007" autocomplete="off">
                        <datalist id="patientIds"></datalist>
                        <button id="dashboardSearchButton" type="button" class="primary-btn">
                            <i class="fas fa-chart-line" aria-hidden="true"></i>
                            Ver Dashboard
                        </button>
                    </div>

                    <p id="searchErrorMsg" class="form-error" role="alert" aria-live="polite"></p>
                    <p id="searchStatusMsg" class="form-status" aria-live="polite"></p>

                    <a href="reuma_index.html" class="link-back">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        Volver al Hub Clínico
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="modules/hubTools.js?v=20260306l"></script>
    <script src="modules/utils.js?v=20260306l"></script>
    <script src="modules/reumaCurrentPatient.js?v=20261114a"></script>
    <script src="modules/fieldNormalizer.js?v=20260306l"></script>
    <script src="modules/mockPatients.js?v=20260306l"></script>
    <script src="modules/dataManager.js?v=20261113a"></script>
    <script src="script.js?v=20261114a"></script>
    <script src="scripts/reuma_patient_read_port.js?v=20260926a"></script>
    <script src="scripts/script_dashboard_search.js?v=20261114a"></script>
</body>
</html>

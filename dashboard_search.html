<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cima.aemps.es; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Paciente - Hub Clínico</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=6.0.0-beta3">
    <link rel="stylesheet" href="css/nexus_tokens.css?v=20261121-t6">
    <link rel="stylesheet" href="css/nexus_base.css?v=20261121-t6">
    <link rel="stylesheet" href="css/nexus_piezas.css?v=20261121-t7b">
    <link rel="modulepreload" href="modules/nexus/piezas/nx-shell.js">
    <link rel="modulepreload" href="modules/nexus/menus.js">
    <link rel="modulepreload" href="modules/nexus/version.js">
    <link rel="modulepreload" href="modules/nexus/avisos.js">
    <link rel="modulepreload" href="modules/nexus/piezas/nx-aviso.js">
    <link rel="stylesheet" href="style.css?v=20261121-t6">
</head>
<body class="nx-pagina">
    <div class="nx-marco">
<nx-shell modulo="reuma" raiz="" pagina="dashboard_search.html">
<p class="nx-profesional"><i class="fas fa-user-circle" aria-hidden="true"></i> <span id="currentProfessional"></span></p>
<div class="nx-buscador" role="search">
<div class="nx-campo">
<label class="nx-campo__etiqueta" for="patientSearch">Buscar paciente</label>
<input class="nx-campo__control" type="text" id="patientSearch" placeholder="Buscar paciente por CIP..." autocomplete="off">
</div>
<button type="button" class="nx-boton nx-boton--secundario nx-boton--icono hidden" id="clearPatientSearch" aria-label="Limpiar búsqueda"><i class="fas fa-times-circle" aria-hidden="true"></i></button>
</div>
<div class="db-status-indicator db-status-indicator--empty" id="dbStatusIndicator" role="status" title="Clic para cargar/recargar BD">
                <i class="fas fa-database db-status-indicator__icon" id="dbStatusIcon"></i>
                <div class="db-status-indicator__text">
                    <span class="db-status-indicator__label" id="dbStatusLabel">BD no cargada</span>
                    <span class="db-status-indicator__time" id="dbStatusTime"></span>
                </div>
            </div>
</nx-shell>
<script type="module" async src="modules/nexus/piezas/nx-shell.js"></script>

        <main class="main-content nx-marco__contenido">
            <header class="nx-cabecera">
                <div>
                    <p class="nx-cabecera__ruta">Reumatología · Pacientes</p>
                    <h1 class="nx-cabecera__titulo">Buscar paciente</h1>
                    <p class="nx-cabecera__texto">Introduce el identificador del paciente para abrir su cuadro de mando individual.</p>
                </div>
            </header>
            <section class="nx-tarjeta" aria-labelledby="buscarPacienteTitulo">
                <header class="nx-tarjeta__cabecera"><h2 id="buscarPacienteTitulo" class="nx-tarjeta__titulo">Cuadro de mando de paciente</h2></header>
                <div class="nx-tarjeta__cuerpo">
                    <div class="nx-buscador">
                        <div class="nx-campo">
                            <label class="nx-campo__etiqueta" for="dashboardSearchInput">CIP</label>
                            <input class="nx-campo__control" type="text" id="dashboardSearchInput" list="patientIds" placeholder="Ej: ESP-2024-007" autocomplete="off" aria-describedby="searchErrorMsg searchStatusMsg">
                            <datalist id="patientIds"></datalist>
                        </div>
                        <button id="dashboardSearchButton" type="button" class="nx-boton nx-boton--principal">
                            <i class="fas fa-chart-line" aria-hidden="true"></i>
                            Ver dashboard
                        </button>
                    </div>
                    <p id="searchErrorMsg" class="nx-campo__error nx-campo__error--prefijo" role="alert" aria-live="polite"></p>
                    <p id="searchStatusMsg" class="nx-campo__ayuda" aria-live="polite"></p>
                </div>
                <footer class="nx-tarjeta__pie">
                    <a href="reuma_index.html" class="nx-boton nx-boton--discreto"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver al Hub Clínico</a>
                </footer>
            </section>
        </main>
    </div>

    <script src="modules/hubTools.js?v=20260306l"></script>
    <script src="modules/utils.js?v=20260306l"></script>
    <script src="modules/reumaCurrentPatient.js?v=20261114a"></script>
    <script src="modules/fieldNormalizer.js?v=20260306l"></script>
    <script src="modules/mockPatients.js?v=20260306l"></script>
    <script src="modules/dataManager.js?v=20261113a"></script>
    <script src="script.js?v=20261114a"></script>
    <script src="scripts/reuma_patient_read_port.js?v=20260926a"></script>
    <script src="scripts/script_dashboard_search.js?v=20261114a"></script>
</body>
</html>
